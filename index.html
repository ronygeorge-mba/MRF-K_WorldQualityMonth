<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>World Quality Month Celebrations, MRF-K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b1e20;
      --paper: #e8eaeb;
      --card: #ffffff;
      --line: #c9cdcf;
      --yel: #f5c400;
      --mut: #555c60;
      --dark: #1b1e20;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink:#eef0f1; --paper:#141617; --card:#202426; --line:#363b3e; --mut:#a2a9ad;
      }
    }
    :root[data-theme="dark"] {
      --ink:#eef0f1; --paper:#141617; --card:#202426; --line:#363b3e; --mut:#a2a9ad;
    }
    *, *:before, *:after { box-sizing: inherit; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 17px/1.6 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1, h2, h3 { font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; line-height: 1.05; margin: 0; }
    a { color: inherit; }
    .tread {
      background-color: var(--dark);
      background-image: repeating-linear-gradient(115deg, transparent 0 16px, rgba(245,196,0,.09) 16px 24px);
    }
    header.top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      color: #fff;
      border-bottom: 3px solid var(--yel);
    }
    nav {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      padding: 0 12px;
      max-width: 1100px;
      margin: 0 auto;
    }
    nav a {
      color: #d8dcde;
      text-decoration: none;
      padding: 14px 14px;
      white-space: nowrap;
      font-weight: 600;
      font-size: 15px;
      border-bottom: 3px solid transparent;
      margin-bottom: -3px;
    }
    nav a:hover { color: #fff; }
    nav a.on { color: var(--yel); border-bottom-color: var(--yel); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--yel); outline-offset: 2px; }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    .hero {
      color: #fff;
      padding: 56px 28px;
      border-radius: 6px;
      margin-bottom: 28px;
    }
    .hero h1 {
      font-size: clamp(32px, 7vw, 76px);
      font-weight: 700;
      max-width: none;
      text-wrap: balance;
    }
    .hero p {
      max-width: 52ch;
      color: #d8dcde;
      margin: 16px 0 22px;
    }
    .badge {
      display: inline-block;
      background: var(--yel);
      color: #1b1e20;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 3px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    .tile {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 6px solid var(--yel);
      padding: 18px;
      border-radius: 4px;
      color: inherit;
      text-decoration: none;
    }
    .tile:hover { border-color: var(--ink); border-left-color: var(--yel); }
    .tile h3 { font-size: 26px; margin-bottom: 4px; }
    .tile p { margin: 0; color: var(--mut); font-size: 15px; }
    .page-title {
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .lead { color: var(--mut); max-width: 62ch; margin: 0 0 22px; }
    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 34px;
    }
    .flow span.s {
      background: var(--dark);
      color: #fff;
      padding: 10px 16px;
      border-radius: 3px;
      font-weight: 600;
    }
    .flow span.s b { color: var(--yel); }
    .flow span.a { font-size: 24px; color: var(--mut); }
    .era {
      display: grid;
      grid-template-columns: 260px 1fr;
      margin-bottom: 26px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }
    .era .rail {
      color: #fff;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .era .yrs {
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-weight: 700;
      font-size: 44px;
      line-height: 1;
      color: var(--yel);
    }
    .era .ico { width: 84px; height: 84px; }
    .era .body { padding: 24px 26px; }
    .era h2 { font-size: clamp(26px, 4vw, 36px); margin-bottom: 10px; }
    .focus {
      background: rgba(245,196,0,.18);
      border-left: 5px solid var(--yel);
      padding: 12px 14px;
      margin: 0 0 20px;
      border-radius: 2px;
    }
    .focus b { display: block; }
    .who { font-family: "Barlow Condensed", sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 10px; }
    .leaders { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .lead-card { display: flex; gap: 14px; border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
    .av {
      flex: none; width: 64px; height: 64px; border-radius: 50%;
      background: var(--dark); color: var(--yel); display: grid; place-items: center;
      font: 700 24px "Barlow Condensed", sans-serif; overflow: hidden; border: 3px solid var(--yel);
    }
    .av img { width: 100%; height: 100%; object-fit: cover; }
    .lead-card h4 { margin: 0 0 2px; font-size: 17px; }
    .lead-card p { margin: 0; font-size: 15px; color: var(--mut); line-height: 1.45; }
    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
      align-items: start;
      padding: 28px 22px 0;
      border-bottom: 14px solid #7a5a35;
      margin-bottom: 30px;
      background: var(--card);
      border-radius: 4px 4px 0 0;
    }
    .book { display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; }
    .cover {
      min-height: 260px;
      border-left: 18px solid var(--yel);
      border-radius: 3px 8px 8px 3px;
      padding: 24px 22px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      box-shadow: 6px 6px 0 rgba(0,0,0,.18);
    }
    .cover h3 { font-size: 34px; font-weight: 700; }
    .cover span { color: var(--yel); font-weight: 600; }
    .book p { margin: 0; color: var(--mut); font-size: 15px; }
    .dl, .go {
      background: var(--yel); color: #1b1e20; border: 0; padding: 12px 18px;
      font: 600 16px Barlow, system-ui, sans-serif; border-radius: 3px; cursor: pointer;
    }
    .dl:hover, .go:hover { filter: brightness(.93); }
    .ghost {
      background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 12px 18px;
      font: 600 16px Barlow, system-ui, sans-serif; border-radius: 3px; cursor: pointer;
    }
    .tb { border-collapse: collapse; width: 100%; font-size: 15px; }
    .tb th, .tb td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
    .tb th { background: var(--dark); color: #fff; }
    .note {
      background: var(--card); border: 1px solid var(--line); border-left: 8px solid var(--yel);
      border-radius: 4px; padding: 22px 24px; margin: 0 0 34px;
    }
    .note h2 { font-size: clamp(26px, 4vw, 36px); margin-bottom: 10px; }
    .note p { margin: 0 0 12px; max-width: 68ch; }
    .note a.go { display: inline-block; text-decoration: none; }
    .sub { font-size: clamp(26px, 4vw, 36px); margin: 0 0 12px; }
    .trial {
      background: repeating-linear-gradient(-45deg, #f5c400 0 18px, #1b1e20 18px 36px);
      padding: 7px; border-radius: 4px; margin: 0 0 24px;
    }
    .trial div { background: #1b1e20; color: #fff; padding: 16px 20px; border-radius: 2px; text-align: center; }
    .trial b { display: block; color: #f5c400; font: 700 clamp(26px, 5vw, 46px)/1.05 "Barlow Condensed","Arial Narrow",sans-serif; }
    .trial span { font-size: 15px; color: #d8dcde; }
    .sh { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .ov {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px;
    }
    .modal {
      background: var(--card); color: var(--ink); width: 100%; max-width: 420px; padding: 24px; border-radius: 6px;
      border-top: 6px solid var(--yel); display: flex; flex-direction: column; gap: 14px;
    }
    .modal h2 { font-size: 30px; }
    .modal p { margin: 0; color: var(--mut); font-size: 15px; }
    .modal label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 15px; }
    .modal input {
      font: 400 17px Barlow, system-ui, sans-serif; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 3px; background: var(--paper); color: var(--ink);
    }
    .modal .row { display: flex; gap: 10px; justify-content: flex-end; }
    .modal .err { color: #c0392b; min-height: 1.2em; }
    .soon {
      background: var(--card); border: 2px dashed var(--line); padding: 36px; border-radius: 4px; color: var(--mut);
    }
    .end { text-align: center; padding: 90px 20px; color: #fff; min-height: 70vh; }
    .end h1 { font-size: clamp(40px, 8vw, 72px); color: var(--yel); }
    footer { text-align: center; color: var(--mut); font-size: 14px; padding: 0 18px 30px; }
    @media (max-width:760px) {
      .era { grid-template-columns: 1fr; }
      .era .rail { flex-direction: row; align-items: center; }
      .era .ico { width: 60px; height: 60px; }
      .era .yrs { font-size: 34px; }
      .hero { padding: 40px 20px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="top tread">
    <nav id="nav" aria-label="Main"></nav>
  </header>
  <main id="app"></main>
  <footer>World Quality Month Celebrations</footer>

  <script>
    var TABS = [
      ["home", "Home"],
      ["history", "History of Quality"],
      ["schedule", "Program Schedule"],
      ["learning", "Learning & Development"],
      ["bookshelf", "Bookshelf"],
      ["games", "Games Corner"]
    ];

    var BLURB = {
      history: "150 years of quality, from inspection to Quality 4.0.",
      schedule: "What is happening on each day of the festival.",
      learning: "Training and learning material on quality.",
      bookshelf: "Download the featured books as PDFs.",
      games: "Quality quizzes and games to play."
    };

    var ICONS = {
      1: '<svg class="ico" viewBox="0 0 80 80" fill="none" stroke="#f5c400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="34" r="20"/><path d="M49 49l18 18"/><path d="M26 35h16M34 27v16"/></svg>',
      2: '<svg class="ico" viewBox="0 0 80 80" fill="none" stroke="#f5c400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M40 8l26 10v20c0 16-11 28-26 34C25 66 14 54 14 38V18l26-10z"/><path d="M40 20v28M28 32h24M28 44h24"/></svg>',
      3: '<svg class="ico" viewBox="0 0 80 80" fill="none" stroke="#f5c400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="10"/><circle cx="40" cy="12" r="5"/><circle cx="40" cy="68" r="5"/><circle cx="12" cy="40" r="5"/><circle cx="68" cy="40" r="5"/><path d="M40 17v13M40 50v13M17 40h13M50 40h13"/></svg>',
      4: '<svg class="ico" viewBox="0 0 80 80" fill="none" stroke="#f5c400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 62V46M26 62V34M42 62V42M58 62V22M10 18c14 0 23-8 38-8h22"/></svg>'
    };

    var ERAS = [
      {
        y: "Late 1800s – 1920s",
        t: "Inspection and Scientific Management",
        f: "Quality Control (Inspection)",
        d: "Mass production created standardized, interchangeable parts, requiring dedicated inspectors to sort defective products at the end of the assembly line before they reached customers.",
        l: [
          ["Frederick Winslow Taylor", "Introduced Scientific Management, separating planning from execution and establishing formal inspection standards."],
          ["Henry Ford", "Pioneered the moving assembly line, making dimensional consistency and standardized gauging essential."],
          ["Walter A. Shewhart", "Invented the statistical Control Chart (1924) at Bell Labs, laying the mathematical groundwork to separate normal process noise from true defects."]
        ]
      },
      {
        y: "1940s – 1970s",
        t: "Statistical Quality Control and the Japanese Quality Revolution",
        f: "Quality Assurance (Prevention)",
        d: "Quality shifted upstream from catching bad products to designing defect-free processes, powered by statistical sampling and frontline worker empowerment in post-war Japan.",
        l: [
          ["W. Edwards Deming", "Taught Japanese engineers systems thinking and the PDCA (Plan-Do-Check-Act) cycle for continuous process improvement."],
          ["Joseph M. Juran", "Introduced the Quality Trilogy (Planning, Control, Improvement) and applied the Pareto Principle to isolate the “vital few” causes of defects."],
          ["Kaoru Ishikawa", "Created the Fishbone (Cause-and-Effect) Diagram and launched Quality Circles, giving shop-floor operators direct ownership over problem-solving."]
        ]
      },
      {
        y: "1970s – 1990s",
        t: "Total Quality Management (TQM) and the Birth of ISO 9001",
        f: "Total Quality Management (System-Wide Improvement)",
        d: "Quality evolved from an engineering function into an organization-wide culture driven by executive leadership, customer satisfaction, and global standards.",
        l: [
          ["Philip Crosby", "Popularized “Zero Defects” and Cost of Quality (“Quality is Free”), proving that prevention costs far less than rework."],
          ["Armand Feigenbaum", "Defined Total Quality Control, establishing that every department, from procurement to sales, shares accountability for quality."],
          ["Bill Smith (Motorola)", "Pioneered Six Sigma (1986), combining statistical rigor with business strategy to drive defects down to near-zero levels."]
        ]
      },
      {
        y: "2000s – Present",
        t: "Process Focus, Continual Improvement, and Risk-Based Thinking",
        f: "Proactive & Connected Excellence",
        d: "Modern quality management integrates end-to-end process alignment, proactive risk mitigation (ISO 9001:2015), Lean efficiency, and real-time digital analytics (Quality 4.0).",
        l: [
          ["Taiichi Ohno & Shigeo Shingo", "Toyota Production System principles, including poka-yoke error-proofing and waste elimination."],
          ["Genichi Taguchi", "Advanced robust engineering and the Quality Loss Function, shaping modern design-for-reliability and risk-based thinking."]
        ]
      }
    ];

    var END = new Date(2026, 10, 25, 23, 59, 59);

    function ini(n) {
      return n.replace(/\(.*\)/, "").split(/ & | /).filter(function(w) { return /^[A-Z]/.test(w); }).slice(0, 2).map(function(w) { return w[0]; }).join("");
    }

    function history() {
      var h = '<h1 class="page-title">Quality Management History: A 150-Year Timeline</h1><p class="lead">How making things right moved from catching mistakes at the end of the line to building quality into every process.</p>';
      h += '<div class="flow" aria-label="Core progression"><span class="s"><b>Quality Control</b> (Inspection)</span><span class="a">→</span><span class="s"><b>Quality Assurance</b> (Prevention)</span><span class="a">→</span><span class="s"><b>TQM</b> (Organization-wide)</span><span class="a">→</span><span class="s"><b>Quality 4.0</b> (Digital &amp; Connected)</span></div>';
      ERAS.forEach(function(e, i) {
        h += '<section class="era"><div class="rail tread">' + ICONS[i + 1] + '<div class="yrs">' + e.y + '</div></div><div class="body"><h2>' + e.t + '</h2><p class="focus"><b>Era focus: ' + e.f + '</b>' + e.d + '</p><p class="who">Key Leaders &amp; Influencers</p><div class="leaders">';
        e.l.forEach(function(p) {
          h += '<div class="lead-card"><div class="av" data-name="' + p[0] + '">' + ini(p[0]) + '</div><div><h4>' + p[0] + '</h4><p>' + p[1] + '</p></div></div>';
        });
        h += '</div></div></section>';
      });
      return h;
    }

    function home() {
      var h = '<section class="hero tread"><h1>World Quality Month Celebrations</h1><p>Ten days of learning, games and friendly competition around the one thing that keeps every tyre we make on track: quality.</p><span class="badge">Celebrating Quality — November 2026</span></section><div class="grid">';
      TABS.slice(1).forEach(function(t) {
        h += '<a class="tile" href="#' + t[0] + '"><h3>' + t[1] + '</h3><p>' + BLURB[t[0]] + '</p></a>';
      });
      return h + '</div>';
    }

    var BOOKS = [
      { t: "Six Sigma Green Belt", s: "Certification Training Manual", f: "Six-Sigma-Green-Belt-Certification-Training-Manual.pdf", u: "https://raw.githubusercontent.com/ronygeorge-mba/MRF-K_WorldQualityMonth/main/Six-Sigma-Green-Belt-Certification-Training-Manual.pdf", z: "Practical Lean Six Sigma tools and the DMAIC method for Green Belt projects." },
      { t: "Lean Six Sigma Black Belt", s: "Certification Training Manual", f: "Lean-Six-Sigma-Black-Belt-Certification-Training-Manual.pdf", u: "https://raw.githubusercontent.com/ronygeorge-mba/MRF-K_WorldQualityMonth/main/Lean-Six-Sigma-Black-Belt-Certification-Training-Manual.pdf", z: "Advanced process improvement, statistical analysis and leadership tools for Black Belt projects." }
    ];

    function bookshelf() {
      var h = '<h1 class="page-title">Bookshelf</h1><p class="lead">Training manuals for everyone. Choose a book, enter your name and employee number, and the download starts.</p><div class="shelf">';
      BOOKS.forEach(function(b, i) {
        h += '<article class="book"><div class="cover tread"><span>' + b.s + '</span><h3>' + b.t + '</h3></div><p>' + b.z + '</p><button class="dl" data-i="' + i + '">Download PDF</button></article>';
      });
      return h + '</div>';
    }

    function openModal(i) {
      var bk = BOOKS[i];
      var m = document.createElement("div");
      m.className = "ov";
      m.innerHTML = '<form class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Before you download</h2><p>' + bk.t + ' ' + bk.s + '</p><label>Your name<input name="n" required></label><label>Employee number<input name="e" required></label><div class="err"></div><div class="row"><button type="button" class="ghost">Cancel</button><button type="submit" class="go">Download</button></div></form>';
      document.body.appendChild(m);
      var f = m.querySelector("form"), err = m.querySelector(".err"), go = m.querySelector(".go");
      f.elements.n.focus();

      function close() {
        m.remove();
        document.removeEventListener("keydown", esc);
      }
      function esc(e) { if (e.key === "Escape") close(); }
      document.addEventListener("keydown", esc);
      m.querySelector(".ghost").onclick = close;
      m.addEventListener("click", function(e) { if (e.target === m) close(); });
      f.addEventListener("submit", function(e) {
        e.preventDefault();
        if (!f.elements.n.value.trim() || !f.elements.e.value.trim()) {
          err.textContent = "Enter both your name and employee number.";
          return;
        }
        err.textContent = "";
        go.disabled = true;

        fetch(bk.u)
          .then(function(r) {
            if (!r.ok) throw { code: "fetch" };
            return r.blob();
          })
          .then(function(blob) {
            var a = document.createElement('a');
            var url = URL.createObjectURL(blob);
            a.href = url;
            a.download = bk.f;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            close();
          })
          .catch(function(x) {
            go.disabled = false;
            err.textContent = x && x.code === "fetch" ? "The PDF could not be downloaded from the server. Please try again." : "The download could not start. Please try again.";
          });
      });
    }

    document.addEventListener("click", function(e) {
      var b = e.target.closest && e.target.closest(".dl");
      if (b) openModal(+b.dataset.i);
    });

    var COURSES = [
      ["Data Strategy", "https://365datascience.com/courses/data-strategy/", "365 Data Science. With Bernard Marr: how to align business and data strategy. About 6 hours."],
      ["Data Literacy", "https://365datascience.com/courses/data-literacy/", "365 Data Science. Build the skills to read, understand and use data."],
      ["Statistics", "https://365datascience.com/courses/statistics/", "365 Data Science. Core statistics for working with data."],
      ["Introduction to Python", "https://365datascience.com/courses/introduction-to-python/", "365 Data Science. A beginner-friendly start to Python."],
      ["Six Sigma Yellow Belt", "https://www.6sigmastudy.com/certification/six_sigma_yellow_belt", "6sigmastudy. Free online course and exam."]
    ];

    function learning() {
      var open = new Date() < Date.UTC(2026, 10, 20, 15, 0, 0);
      return '<h1 class="page-title">Learning &amp; Development</h1><p class="lead">Keep learning during World Quality Month.</p><section class="note"><h2>' + (open ? 'Learn for free on 365 Data Science' : '365 Data Science courses') + '</h2><p>Free access is available to eligible employees through 20 November 2026.</p><a class="go" href="https://365datascience.com/" target="_blank" rel="noopener">Visit 365 Data Science</a></section><h2 class="sub">Featured courses</h2><div class="grid">' + COURSES.map(function(c) {
        return '<a class="tile" href="' + c[1] + '" target="_blank" rel="noopener"><h3>' + c[0] + '</h3><p>' + c[2] + '</p></a>';
      }).join("") + '</div>';
    }

    function soon(k) {
      var t = TABS.filter(function(x) { return x[0] == k; })[0][1];
      return '<h1 class="page-title">' + t + '</h1><div class="soon">This section is being prepared. Check back soon.</div>';
    }

    function render() {
      var k = (location.hash || "#home").slice(1);
      if (!TABS.some(function(t) { return t[0] == k; })) k = "home";
      if (new Date() > END) {
        document.getElementById("nav").style.display = "none";
        document.getElementById("app").innerHTML = '<section class="end tread"><h1>The celebrations have ended</h1><p>Thank you to everyone who joined World Quality Month. See you next year.</p></section>';
        return;
      }
      document.getElementById("nav").innerHTML = TABS.map(function(t) {
        return '<a href="#' + t[0] + '"' + (t[0] == k ? ' class="on" aria-current="page"' : '') + '>' + t[1] + '</a>';
      }).join("");
      document.getElementById("app").innerHTML = k == "home" ? home() : k == "history" ? history() : k == "bookshelf" ? bookshelf() : k == "learning" ? learning() : soon(k);
      window.scrollTo(0, 0);
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
